<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Pottery</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f7f4ef; color: #3a332c; padding: 24px; }
  main { max-width: 22rem; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
  p { margin: 0 0 1.5rem; opacity: .7; }
  a.btn { display: block; padding: .85rem 1rem; margin: .5rem 0; border-radius: .75rem;
          background: #3a332c; color: #f7f4ef; text-decoration: none; font-weight: 600; }
  a.btn.off { background: none; color: #3a332c; border: 1px solid rgba(58,51,44,.25); font-weight: 400; }
  @media (prefers-color-scheme: dark) {
    body { background: #22201d; color: #ece6de; }
    a.btn { background: #ece6de; color: #22201d; }
    a.btn.off { background: none; color: #ece6de; border-color: rgba(236,230,222,.3); }
  }
</style>
</head>
<body>
<main>
  <h1>Cozy Pottery</h1>
  <p>Открываем магазин…</p>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.EvgeniiBudanov.RealPottery">Google Play</a>
  <a class="btn off" id="ios" href="#">App Store</a>
</main>
<script>
// Смарт-линк: одна ссылка на обе платформы + метки кампании для консолей.
// Использование: /get/?c=pupirka  — метка берётся из словаря ниже.
// Живёт в репозитории PEPEPRIV/cozypottery, раздаётся GitHub Pages.

var ANDROID_PACKAGE = 'com.EvgeniiBudanov.RealPottery';
var IOS_APP_ID = '6806569344';        // Cozy Pottery: Clay Studio
var IOS_PROVIDER_TOKEN = '129378616'; // pt= из App Store Connect → App Analytics → Campaigns

// Словарь кампаний. Держать метки здесь, а не раскидывать по постам:
// так отчёты в консоли не расползаются на десять написаний одного канала.
var CAMPAIGNS = {
  pupirka: { source: 'telegram', medium: 'social', campaign: 'pupirka' }
};

var raw = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
var key = /^[a-z0-9_-]{1,40}$/.test(raw) ? raw : '';           // мусор в referrer не пускаем
var c = CAMPAIGNS[key] || { source: key || 'direct', medium: 'link', campaign: key || 'direct' };

var referrer = 'utm_source=' + c.source + '&utm_medium=' + c.medium + '&utm_campaign=' + c.campaign;
var playUrl = 'https://play.google.com/store/apps/details?id=' + ANDROID_PACKAGE +
              '&referrer=' + encodeURIComponent(referrer);
var appStoreUrl = IOS_APP_ID
  ? 'https://apps.apple.com/app/apple-store/id' + IOS_APP_ID +
    '?pt=' + IOS_PROVIDER_TOKEN + '&ct=' + encodeURIComponent(c.campaign) + '&mt=8'
  : '';

var android = document.getElementById('android');
var ios = document.getElementById('ios');
android.href = playUrl;

if (appStoreUrl) {
  ios.href = appStoreUrl;
} else {
  ios.textContent = 'App Store — скоро';
  ios.removeAttribute('href');
}

var ua = navigator.userAgent;
var isIOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
var isAndroid = /Android/.test(ua);

if (isAndroid) location.replace(playUrl);
else if (isIOS && appStoreUrl) location.replace(appStoreUrl);
else document.querySelector('p').textContent = 'Выбери магазин:';
</script>
</body>
</html>
